<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Botones e Imágenes</title>
  <link rel="stylesheet" href="bot.css">
</head>
<body>
  <h2>Taller: Botones </h2>

  <img src="aguila.jpg">
  

  
  <button onclick="mostrarImagen(1)"> Imagen 1</button>
  <button onclick="mostrarImagen(2)">Imagen 2</button>
  <button onclick="mostrarImagen(3)">Imagen 3 </button>

  
  <div id="contenedor">
    <img id="img1" src="C:\Users\DOCENTE MAÑANA\Desktop\Clase botones\leon.jpg" alt="Imagen 1" style="display:none; width:300px;">
    <img id="img2" src="C:\Users\DOCENTE MAÑANA\Desktop\Clase botones\aguila.jpg" alt="Imagen 2" style="display:none; width:300px;">
    <img id="img3" src="C:\Users\DOCENTE MAÑANA\Desktop\Clase botones\lobo.jpg" alt="Imagen 3" style="display:none; width:300px;">
  </div>

  <script >
    function mostrarImagen(num) {
  
  document.getElementById("img1").style.display = "none";
  document.getElementById("img2").style.display = "none";
  document.getElementById("img3").style.display = "none";

  
  document.getElementById("img" + num).style.display = "block";
}

  </script>
</body>
</html>
